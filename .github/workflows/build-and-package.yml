name: CI - Build and Package

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build native dictionary library
      shell: pwsh
      run: .\build-native.ps1

    - name: Restore dependencies
      run: dotnet restore

    - name: Cache bundled M-Extension-Server
      uses: actions/cache@v4
      with:
        path: artifacts/MExtensionServer
        key: m-extension-server-windows-x64-v1.0.4-4bdd8e068914a769b4ff132080210d2a8be806e9c401a577dd700cb662a302ee-edf198c73f7ffa54e356396833d4c0a34d86366cd59aa0edae9d1559e7960d7c

    - name: Run Unit Tests
      run: dotnet test Niratan.Tests/Niratan.Tests.csproj --no-restore -c Debug --verbosity normal -p:Platform=x64 --logger trx

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: package-test-results
        path: '**/*.trx'

    - name: Publish Minimal
      run: dotnet publish Niratan/Niratan.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:PublishProfile=win-x64.pubxml

    - name: Create Minimal Zip
      shell: pwsh
      run: |
        $publishDir = Get-ChildItem -Path Niratan/bin -Recurse -Directory -Filter publish |
          Where-Object { $_.FullName -like '*\x64\Release\*win-x64*' } |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        if (-not $publishDir) {
          throw "Publish directory not found under Niratan/bin"
        }
        if (-not (Test-Path (Join-Path $publishDir.FullName 'hoshidicts_c_api.dll'))) {
          throw "Native dictionary DLL missing from minimal publish output"
        }
        $runtimeRoot = Join-Path $publishDir.FullName 'MihonBridge'
        $manifestPath = Join-Path $runtimeRoot 'runtime.json'
        if (-not (Test-Path $manifestPath)) {
          throw "Bundled M-Extension-Server manifest missing from minimal publish output"
        }
        $runtime = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
        if (-not (Test-Path (Join-Path $runtimeRoot $runtime.javaExecutable))) {
          throw "Bundled M-Extension-Server Java executable missing from minimal publish output"
        }
        if (-not (Test-Path (Join-Path $runtimeRoot $runtime.serverJar))) {
          throw "Bundled M-Extension-Server JAR missing from minimal publish output"
        }
        if (-not (Test-Path (Join-Path $runtimeRoot $runtime.overlayJar))) {
          throw "Bundled Niratan M-Extension-Server overlay missing from minimal publish output"
        }
        Compress-Archive -Path (Join-Path $publishDir.FullName '*') -DestinationPath Niratan.Minimal.x64.zip

    - name: Publish Full for Setup
      run: dotnet publish Niratan/Niratan.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishProfile=win-x64.pubxml

    - name: Verify Full Publish Contents
      shell: pwsh
      run: |
        $publishDir = Get-ChildItem -Path Niratan/bin -Recurse -Directory -Filter publish |
          Where-Object { $_.FullName -like '*\x64\Release\*win-x64*' } |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        if (-not $publishDir) {
          throw "Publish directory not found under Niratan/bin"
        }
        if (-not (Test-Path (Join-Path $publishDir.FullName 'hoshidicts_c_api.dll'))) {
          throw "Native dictionary DLL missing from full publish output"
        }
        $runtimeRoot = Join-Path $publishDir.FullName 'MihonBridge'
        $manifestPath = Join-Path $runtimeRoot 'runtime.json'
        if (-not (Test-Path $manifestPath)) {
          throw "Bundled M-Extension-Server manifest missing from full publish output"
        }
        $runtime = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
        if (-not (Test-Path (Join-Path $runtimeRoot $runtime.javaExecutable))) {
          throw "Bundled M-Extension-Server Java executable missing from full publish output"
        }
        if (-not (Test-Path (Join-Path $runtimeRoot $runtime.serverJar))) {
          throw "Bundled M-Extension-Server JAR missing from full publish output"
        }
        if (-not (Test-Path (Join-Path $runtimeRoot $runtime.overlayJar))) {
          throw "Bundled Niratan M-Extension-Server overlay missing from full publish output"
        }

    - name: Compile Inno Setup
      shell: pwsh
      run: |
        & "iscc.exe" Packaging/Niratan.iss

    - name: Verify packaged icons
      shell: pwsh
      run: |
        $publishExe = Get-ChildItem -Path Niratan/bin -Recurse -File -Filter Niratan.exe |
          Where-Object { $_.FullName -like '*\x64\Release\*win-x64*\publish\Niratan.exe' } |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        if (-not $publishExe) {
          throw "Published Niratan.exe not found"
        }
        $setupExe = Get-ChildItem -Path Packaging -File -Filter 'Niratan.Setup.x64*.exe' |
          Select-Object -First 1
        if (-not $setupExe) {
          throw "Compiled Niratan Setup executable not found"
        }
        .\scripts\Test-PackagedIcon.ps1 -ExpectedIcon .\Niratan.ico -TargetExecutable $publishExe.FullName
        .\scripts\Test-PackagedIcon.ps1 -ExpectedIcon .\Niratan.ico -TargetExecutable $setupExe.FullName

    - name: Upload Minimal Zip
      uses: actions/upload-artifact@v4
      with:
        name: Niratan.Minimal.x64
        path: Niratan.Minimal.x64.zip

    - name: Upload Setup Exe
      uses: actions/upload-artifact@v4
      with:
        name: Niratan.Setup.x64
        path: Packaging/Niratan.Setup.x64*.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Niratan ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          Niratan.Minimal.x64.zip
          Packaging/Niratan.Setup.x64*.exe
